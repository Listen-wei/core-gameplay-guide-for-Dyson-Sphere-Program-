  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    function resolveProfile(key) {
      const blueprint = blueprints[key];
      const profile = profiles[key];
      return {
        unlock: profile.unlock,
        rate: blueprint.io,
        machines: blueprint.count.startsWith(&quot;精确&quot;) || blueprint.count.includes(&quot;精确/&quot;)
          ? blueprint.count
          : &quot;标准块整数配置（精确 = 实建）：&quot; + blueprint.count,
        logistics: profile.logistics,
        steps: profile.steps,
        checks: profile.checks,
        life: profile.life,
      };
    }

    function render(key) {
      const blueprint = blueprints[key];
      title.textContent = blueprint.title;
      size.textContent = blueprint.size;
      io.textContent = blueprint.io;
      count.textContent = blueprint.count;
      const profile = resolveProfile(key);
      guideUnlock.textContent = profile.unlock;
      guideRate.textContent = profile.rate;
      guideMachines.textContent = profile.machines;
      guideLogistics.textContent = profile.logistics;
      guideSteps.replaceChildren(...profile.steps.map((text) =&gt; {
        const item = document.createElement(&quot;li&quot;);
        item.textContent = text;
        return item;
      }));
      guideChecks.replaceChildren(...profile.checks.map((text) =&gt; {
        const item = document.createElement(&quot;li&quot;);
        item.textContent = text;
        return item;
      }));
      guideLife.textContent = profile.life;
      grid.replaceChildren(...blueprint.pieces.map((piece) =&gt; {
        const [type, x, y, width, height, label] = piece;
        const element = document.createElement(&quot;div&quot;);
        element.className = `dsp-piece dsp-${type} text-small`;
        element.style.left = `${x}%`;
        element.style.top = `${y}%`;
        element.style.width = `${width}%`;
        element.style.height = `${height}%`;
        element.textContent = label;
        return element;
      }));

      root.querySelectorAll(&quot;[data-blueprint]&quot;).forEach((button) =&gt; {
        const selected = button.dataset.blueprint === key;
        button.setAttribute(&quot;aria-pressed&quot;, String(selected));
        button.classList.toggle(&quot;btn-primary&quot;, selected);
      });
    }

    root.querySelectorAll(&quot;[data-blueprint]&quot;).forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; render(button.dataset.blueprint));
    });

    function filterStage(stage) {
      const plan = stagePlans[stage];
      stageTitle.textContent = plan.title;
      stageNow.textContent = plan.now;
      stageGate.textContent = plan.gate;
      const blueprintButtons = [...root.querySelectorAll(&quot;[data-blueprint]&quot;)];
      blueprintButtons.forEach((button) =&gt; {
        button.hidden = stage !== &quot;all&quot; &amp;&amp; stageByBlueprint[button.dataset.blueprint] !== Number(stage);
      });
      root.querySelectorAll(&quot;[data-stage-filter]&quot;).forEach((button) =&gt; {
        const selected = button.dataset.stageFilter === stage;
        button.setAttribute(&quot;aria-pressed&quot;, String(selected));
        button.classList.toggle(&quot;btn-primary&quot;, selected);
      });
      const current = root.querySelector(&quot;[data-blueprint][aria-pressed=&#x27;true&#x27;]&quot;);
      if (current?.hidden) {
        const firstVisible = blueprintButtons.find((button) =&gt; !button.hidden);
        if (firstVisible) render(firstVisible.dataset.blueprint);
      }
    }

    root.querySelectorAll(&quot;[data-stage-filter]&quot;).forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; filterStage(button.dataset.stageFilter));
    });

    render(&quot;starter&quot;);
    filterStage(&quot;all&quot;);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

  };

        .split(/\s+/)

    }

    clearOpenTimeout();
    pinnedByTouch = false;

    autoUpdateCleanup?.();
    autoUpdateCleanup = null;

      middleware: [
        offset(tooltipGap),

        shift({ padding: tooltipGap }),

          apply({ availableHeight, availableWidth, elements }) {

              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
